name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Split-engine unit tests
        run: npm test

      - name: app.css is up to date with index.html
        run: |
          npm run css
          git diff --exit-code public/app.css || (echo "::error::public/app.css is stale. Run 'npm run css' and commit it." && exit 1)

      - name: Worker bundles and wrangler.toml is valid
        run: npx wrangler deploy --dry-run --outdir dist